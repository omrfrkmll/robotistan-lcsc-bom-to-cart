  <rect x="58" y="56" width="24" height="14" rx="2" fill="#38bdf8"/>
  <rect x="62" y="52" width="3" height="4" fill="#cbd5e1"/>
  <rect x="68" y="52" width="3" height="4" fill="#cbd5e1"/>
  <rect x="74" y="52" width="3" height="4" fill="#cbd5e1"/>

  <!-- Cart Wheels -->
  <circle cx="56" cy="88" r="7" fill="#f8fafc"/>
  <circle cx="56" cy="88" r="3" fill="#0f172a"/>
  <circle cx="86" cy="88" r="7" fill="#f8fafc"/>
  <circle cx="86" cy="88" r="3" fill="#0f172a"/>
</svg>
