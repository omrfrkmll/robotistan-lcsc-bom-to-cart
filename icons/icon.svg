  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- PCB Circuit Trace pattern subtle -->
  <path d="M 24 38 L 44 38 L 54 48" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="24" cy="38" r="4" fill="#f97316"/>
